  <!-- Isotope CSS (optionnel) -->
  <style>

    /* Style de base pour Isotope */
    .grid { visibility: hidden; } /* Cache la grille jusqu'à ce qu'Isotope soit chargé */

        .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Catégories */
    .category {
      margin-bottom: 40px;
    }
    .category-title {
      display: inline-block;
      background: #f2ca82;
      border:  solid ;
      font-family: 'Lato', sans-serif;
      font-style: italic;
      font-size: 14px;
      color: #2b2e4d;
      padding-bottom: 10px;
      padding-top: 10px;
      padding-left: 20px;
      padding-right: 20px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .category-title-2 {
      display: inline-block;
      background: #f99ad2;
      border:  solid ;
      font-family: 'Lato', sans-serif;
      font-style: italic;
      font-size: 14px;
      color: #2b2e4d;
      padding-bottom: 10px;
      padding-top: 10px;
      padding-left: 20px;
      padding-right: 20px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Liste des projets */
    .project-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .project-item {
      border: solid ;
      overflow: hidden;
      transition: transform 0.3s;
      background: #8cb5ed;
      filter: saturate(95%);


    }
    .project-item:hover {
      transform: translateY(-5px);
     filter: saturate(105%);
     }
    .project-item img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: solid ;
    }
    .project-item .project-info {
      text-align: center;
      padding: 0px;

    }
    .project-item h3 {
      font-family: 'Lato', sans-serif;
      font-size: 16px;
      color: #2b2e4d;
      margin: 5px 0px 10px 0px;
      text-transform: uppercase;
    }
    .project-item a {
      color: #78bdc2;
      text-decoration: none;
      font-size: 14px;
      font-family: 'Lato', sans-serif;
    }
    .project-item a:hover {
      text-decoration: underline;
    }

  </style>
